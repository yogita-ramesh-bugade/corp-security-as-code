name: fleet-gitops

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate (offline checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint pyyaml
      - name: Lint YAML
        run: yamllint -d relaxed fleet/
      - name: Validate macOS profiles and declarations
        run: python scripts/validate_profiles.py
      - name: Browser policy outputs are up to date
        run: python browser/render.py --check
      - name: Post plain-English change summary
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/policy_diff.py origin/${{ github.base_ref }} > diff.md
          cat diff.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file diff.md

  fleet:
    name: Fleet dry run / apply
    needs: validate
    runs-on: ubuntu-latest
    env:
      FLEET_URL: ${{ secrets.FLEET_URL }}
      FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
      FLEET_GLOBAL_ENROLL_SECRET: ${{ secrets.FLEET_GLOBAL_ENROLL_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g fleetctl@latest
      - name: Connect to Fleet
        run: fleetctl config set --address "$FLEET_URL" --token "$FLEET_TOKEN"
      - name: Dry run
        run: fleetctl gitops -f fleet/default.yml --dry-run
      - name: Apply (main branch only)
        if: github.event_name == 'push'
        run: fleetctl gitops -f fleet/default.yml
