agent_options:
  config:
    decorators:
      load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
    options:
      disable_distributed: false
      distributed_interval: 10
      distributed_plugin: tls
      distributed_tls_max_attempts: 3
      logger_tls_endpoint: /api/osquery/log
      logger_tls_period: 10
      pack_delimiter: /
  overrides:
controls:
  apple_settings:
    configuration_profiles:
      - path: ./profiles/macos/lumen-firewall.mobileconfig
      - path: ./profiles/macos/lumen-screen-lock.mobileconfig
      - path: ./profiles/macos/lumen-gatekeeper.mobileconfig
      - path: ./profiles/macos/lumen-ddm-passcode.json
      - path: ./profiles/macos/santa-system-extension.mobileconfig
      - path: ./profiles/macos/santa-tcc.mobileconfig
      - path: ./profiles/macos/lumen-nudge.mobileconfig
      - path: ../browser/out/macos/lumen-chrome.mobileconfig
  scripts:
    - path: ../windows/scripts/windows-firewall-smb.ps1
    - path: ../windows/scripts/windows-asr-audit.ps1
    - path: ../windows/scripts/windows-bitlocker.ps1
    - path: ../browser/out/windows/lumen-chrome.ps1
custom_host_vitals:
labels:
  - name: ring-canary
    description: First ring - one lab device receives new changes first.
    query: SELECT 1 FROM system_info WHERE hostname LIKE 'fleet-ubuntu-lab%';
  - name: ring-pilot
    description: Second ring - a small group, after canary is healthy.
    query: SELECT 1 FROM system_info WHERE hostname LIKE 'fleet-macos-lab%' OR hostname LIKE 'fleet-windows-lab%';
  - name: ring-all
    description: Everyone.
    query: SELECT 1;
org_settings:
  activity_expiry_settings:
    activity_expiry_enabled: false
    activity_expiry_window: 0
    preserve_host_activities_on_reenrollment: false
  certificate_authorities:
    custom_est_proxy:
    custom_scep_proxy:
    digicert:
    hydrant:
    ndes_scep_proxy:
    smallstep:
  features:
    enable_host_users: true
    enable_software_inventory: true
    historical_data:
      uptime: true
      vulnerabilities: true
  fleet_desktop:
    alternative_browser_host:
    sso_enabled: false
    transparency_url: https://fleetdm.com/transparency
  host_expiry_settings:
    host_expiry_enabled: false
    host_expiry_window: 0
  integrations:
    certificates_disable_host_end_user_binding:
    certificates_idp_client_ids:
    certificates_idp_introspection_urls:
    conditional_access_enabled:
    google_calendar:
    jira:
    zendesk:
  mdm:
    apple_server_url:
    end_user_authentication:
      entity_id:
      idp_name:
      issuer_uri:
      metadata:
      metadata_url:
  org_info:
    contact_url: https://fleetdm.com/company/contact
    org_logo_path_dark_mode: ./lib/org_logo/dark.jpg
    org_logo_path_light_mode: ./lib/org_logo/light.jpg
    org_name: Lumen AI
  secrets:
  - secret: $FLEET_GLOBAL_ENROLL_SECRET
  server_settings:
    ai_features_disabled: false
    deferred_save_host: false
    discard_reports_data: false
    enable_analytics: true
    live_reporting_disabled: false
    report_cap: 0
    scripts_disabled: false
    server_url: https://corp-lab.tail832443.ts.net
  sso_settings:
    enable_sso: false
    enable_sso_idp_login: false
    entity_id:
    idp_image_url:
    idp_name:
    metadata:
    metadata_url:
    sso_server_url:
  webhook_settings:
    activities_webhook:
      destination_url:
      enable_activities_webhook: false
    failing_policies_webhook:
      destination_url:
      enable_failing_policies_webhook: false
      host_batch_size: 0
    host_status_webhook:
      days_count: 0
      destination_url:
      enable_host_status_webhook: false
      host_percentage: 0
    interval: 24h0m0s
    vulnerabilities_webhook:
      destination_url:
      enable_vulnerabilities_webhook: false
      host_batch_size: 0
  yara_rules:
policies:
  - name: macOS - Firewall enabled
    query: SELECT 1 FROM managed_policies WHERE domain = 'com.apple.security.firewall' AND name = 'EnableFirewall' AND value = 1;
    platform: darwin
    critical: false
    description: Checks the Lumen AI firewall profile turns the firewall on.
    resolution: Install the Lumen AI - Firewall profile.
  - name: macOS - Firewall stealth mode
    query: SELECT 1 FROM managed_policies WHERE domain = 'com.apple.security.firewall' AND name = 'EnableStealthMode' AND value = 1;
    platform: darwin
    critical: false
    description: Checks stealth mode is enforced.
    resolution: Install the Lumen AI - Firewall profile.
  - name: macOS - Screen lock password required
    query: SELECT 1 FROM managed_policies WHERE domain = 'com.apple.screensaver' AND name = 'askForPassword' AND value = 1;
    platform: darwin
    critical: false
    description: Checks a password is required after sleep or screensaver.
    resolution: Install the Lumen AI - Screen lock profile.
  - name: macOS - Gatekeeper enforced
    query: SELECT 1 FROM managed_policies WHERE domain = 'com.apple.systempolicy.control' AND name = 'EnableAssessment' AND value = 1;
    platform: darwin
    critical: false
    description: Checks Gatekeeper is turned on by profile.
    resolution: Install the Lumen AI - Gatekeeper profile.
  - name: macOS - Nudge installed
    query: SELECT 1 FROM apps WHERE bundle_identifier = 'com.github.macadmins.Nudge';
    platform: darwin
    critical: false
    description: Checks the Nudge update reminder app is installed.
    resolution: Install the Nudge Suite package.
  - name: macOS - Nudge deadline configured
    query: SELECT 1 FROM managed_policies WHERE domain = 'com.github.macadmins.Nudge' LIMIT 1;
    platform: darwin
    critical: false
    description: Checks the Lumen AI Nudge settings profile is installed.
    resolution: Install the Lumen AI - Nudge profile.
  - name: "Windows - BitLocker on for C:"
    query: SELECT 1 FROM bitlocker_info WHERE drive_letter = 'C:' AND protection_status = 1;
    platform: windows
    critical: false
    description: Checks BitLocker protection is on for the system drive.
    resolution: Run the windows-bitlocker.ps1 script.
  - name: Windows - Firewall on (private profile)
    query: SELECT 1 FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\StandardProfile\EnableFirewall' AND data = 1;
    platform: windows
    critical: false
    description: Checks the Windows firewall is on for the private profile.
    resolution: Run the windows-firewall-smb.ps1 script.
  - name: Windows - SMBv1 disabled
    query: SELECT 1 FROM windows_optional_features WHERE name = 'SMB1Protocol' AND state != 1;
    platform: windows
    critical: false
    description: Checks the legacy SMBv1 protocol is not enabled.
    resolution: Run the windows-firewall-smb.ps1 script.
  - name: Linux - auditd running
    query: SELECT 1 FROM processes WHERE name = 'auditd';
    platform: linux
    critical: false
    description: Checks the audit daemon is running.
    resolution: Run linux/baseline.yml with Ansible.
  - name: Linux - automatic security updates installed
    query: SELECT 1 FROM deb_packages WHERE name = 'unattended-upgrades';
    platform: linux
    critical: false
    description: Checks unattended-upgrades is installed.
    resolution: Run linux/baseline.yml with Ansible.
  - name: Linux - root disk encrypted (LUKS)
    query: SELECT 1 FROM mounts m JOIN disk_encryption d ON m.device_alias = d.name WHERE m.path = '/' AND d.encrypted = 1;
    platform: linux
    critical: false
    description: Checks the root filesystem is on an encrypted disk.
    resolution: Reinstall with full-disk encryption.
  - name: macOS - FileVault on
    query: SELECT 1 FROM disk_encryption WHERE user_uuid IS NOT '' AND filevault_status = 'on' LIMIT 1;
    platform: darwin
    critical: false
    description: Checks FileVault disk encryption is on.
    resolution: Turn on FileVault (production - enforce with recovery key escrow).
  - name: macOS - OS at or above 27.3
    query: SELECT 1 FROM os_version WHERE major > 27 OR (major = 27 AND minor >= 3);
    platform: darwin
    critical: false
    description: Checks macOS meets the minimum version set in Nudge.
    resolution: Install the latest macOS update (Nudge will remind you).
  - name: Windows - OS build at or above 26100
    query: SELECT 1 FROM os_version WHERE CAST(build AS INTEGER) >= 26100;
    platform: windows
    critical: false
    description: Checks Windows 11 24H2 or later.
    resolution: Install Windows updates.
  - name: Windows - Firewall on (public and domain profiles)
    query: SELECT 1 WHERE (SELECT COUNT(*) FROM registry WHERE path IN ('HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\PublicProfile\EnableFirewall', 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\DomainProfile\EnableFirewall') AND data = 1) = 2;
    platform: windows
    critical: false
    description: Checks the firewall is on for the public and domain profiles.
    resolution: Run the windows-firewall-smb.ps1 script.
  - name: Windows - ASR LSASS rule in audit or block
    query: SELECT 1 FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules\9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2' AND data IN (1, 2);
    platform: windows
    critical: false
    description: Checks the credential-theft ASR rule is in audit (2) or block (1) mode.
    resolution: Run the windows-asr-audit.ps1 script.
  - name: Linux - OS release 26 or later
    query: SELECT 1 FROM os_version WHERE major >= 26;
    platform: linux
    critical: false
    description: Checks Ubuntu 26.04 LTS or later.
    resolution: Upgrade to a supported Ubuntu LTS release.
reports:
